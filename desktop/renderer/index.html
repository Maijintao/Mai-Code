<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
  <title>Mai-Code</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-top drag">
        <div id="brand" title="Mai-Code"></div>

        <button id="wsSwitcher" class="no-drag" title="切换工作区">
          <svg class="ws-folder" viewBox="0 0 16 16" width="15" height="15">
            <path fill="currentColor" d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3.2c.4 0 .8.16 1.06.44L8.5 3.7h4.9A1.6 1.6 0 0 1 15 5.3v7.2a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5v-9Zm2 .1v2.9h9.9V5.3a.1.1 0 0 0-.1-.1H8.2a.9.9 0 0 1-.64-.26L6.3 3.6H3.5a.1.1 0 0 0-.1.1Z"/>
          </svg>
          <span id="wsName">默认工作区</span>
          <span class="chev">▾</span>
        </button>
        <div id="wsPopover" class="popover hidden"></div>

        <button id="newChatBtn">
          <span id="newChatIcon" aria-hidden="true"></span>
          <span>新对话</span>
        </button>
      </div>

      <div class="side-label">会话</div>
      <nav id="sessionList" aria-label="会话列表"></nav>

      <div class="side-footer">
        <button id="settingsBtn" class="ghost-btn">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 5.5A2.5 2.5 0 1 0 8 10.5 2.5 2.5 0 0 0 8 5.5Zm0 3.8A1.3 1.3 0 1 1 8 6.7a1.3 1.3 0 0 1 0 2.6Zm6.2-1.3c0 .34-.03.67-.09 1l1.4 1.02a.5.5 0 0 1 .12.64l-1.33 2.3a.5.5 0 0 1-.6.22l-1.6-.64a6 6 0 0 1-1.73 1l-.25 1.7a.5.5 0 0 1-.5.43H6.38a.5.5 0 0 1-.5-.43l-.24-1.7a6 6 0 0 1-1.73-1l-1.6.64a.5.5 0 0 1-.6-.22L.37 11.86a.5.5 0 0 1 .12-.64L1.9 10.2a6.1 6.1 0 0 1 0-2l-1.4-1.02a.5.5 0 0 1-.12-.64L1.7 4.24a.5.5 0 0 1 .6-.22l1.6.64a6 6 0 0 1 1.74-1l.24-1.7a.5.5 0 0 1 .5-.42h2.64a.5.5 0 0 1 .5.43l.25 1.7a6 6 0 0 1 1.73 1l1.6-.64a.5.5 0 0 1 .6.22l1.33 2.3a.5.5 0 0 1-.12.64L14.1 8.2c.06.33.09.66.09 1Z"/></svg>
          <span>设置</span>
        </button>
        <div id="daemonStatus">
          <span class="dot" id="daemonDot"></span>
          <span id="daemonText">连接中…</span>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar" class="drag">
        <div id="sessionTitle">新对话</div>
        <div class="top-right no-drag">
          <div id="ctxMeter" class="ctx hidden" title="上下文占用">
            <span class="track"><i id="ctxBar"></i></span>
            <span id="ctxPct"></span>
          </div>
          <span id="modelBadge" class="badge" title="当前模型">—</span>
        </div>
      </header>

      <div id="stream">
        <div id="emptyState">
          <div id="heroIcon" aria-hidden="true"></div>
          <h1>嗨，我是 Mai</h1>
          <p>选择一个项目文件夹作为工作区，描述你的目标，我会规划步骤、调用工具，并把执行过程实时展示在这里。</p>
          <div class="chips">
            <button class="chip" data-prompt="分析当前项目的目录结构，写一份简短的架构总结">分析项目结构</button>
            <button class="chip" data-prompt="写一个命令行待办清单工具，支持增删和列表">写一个待办清单 CLI 工具</button>
            <button class="chip" data-prompt="检查项目里有没有遗漏的 TODO 和调试代码">检查遗留 TODO</button>
          </div>
        </div>
        <div id="stream-inner"></div>
      </div>

      <footer id="composerWrap">
        <div class="composer no-drag">
          <textarea id="input" rows="1"
            placeholder="描述你的目标，Enter 发送，Shift+Enter 换行"></textarea>
          <button id="sendBtn" title="发送" aria-label="发送">
            <svg viewBox="0 0 16 16" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
          </button>
        </div>
        <div class="composer-hint">Mai 可以调用 bash / 读写文件等工具，敏感操作会先请求你的审批</div>
      </footer>
    </main>
  </div>

  <!-- 设置面板 -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>设置</h2>
        <button id="settingsClose" class="ghost-btn icon-btn" title="关闭">✕</button>
      </div>

      <section class="settings-section">
        <h3>外观</h3>
        <div class="segmented" id="themeSegment">
          <button data-theme="dark" class="active">深色</button>
          <button data-theme="light">浅色</button>
        </div>
      </section>

      <section class="settings-section">
        <h3>模型与端点</h3>
        <label class="field">
          <span>Base URL</span>
          <input id="cfgBaseUrl" type="text" placeholder="https://api.deepseek.com/anthropic" spellcheck="false" />
        </label>
        <label class="field">
          <span>API Key</span>
          <input id="cfgApiKey" type="password" placeholder="已配置则留空保持不变" autocomplete="off" />
        </label>
        <label class="field">
          <span>默认模型</span>
          <input id="cfgModel" type="text" list="modelOptions" placeholder="deepseek-chat" spellcheck="false" />
          <datalist id="modelOptions"></datalist>
        </label>
        <div class="settings-actions">
          <button id="probeBtn" class="secondary-btn">验证并获取模型</button>
          <button id="saveCfgBtn" class="primary-btn">保存</button>
        </div>
        <div id="cfgHint" class="cfg-hint"></div>
      </section>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
