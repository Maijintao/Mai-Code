<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
  <title>Mai-Code</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-top drag">
        <div id="brand" title="Mai-Code"></div>
        <button id="newChatBtn">
          <span>新对话</span>
        </button>
      </div>

      <div class="side-label">项目</div>
      <nav id="projectList" aria-label="项目工作区"></nav>

      <div class="side-label">会话</div>
      <nav id="sessionList" aria-label="会话列表"></nav>

      <div class="side-footer">
        <button id="settingsBtn" class="ghost-btn">
          <svg viewBox="0 0 16 16" width="14" height="14">
            <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
              <path d="M6.72 1.98 A6.15 6.15 0 0 1 9.28 1.98 L8.86 3.94 A4.15 4.15 0 0 1 11.08 5.22 L12.57 3.88 A6.15 6.15 0 0 1 13.85 6.10 L11.95 6.72 A4.15 4.15 0 0 1 11.95 9.28 L13.85 9.90 A6.15 6.15 0 0 1 12.57 12.12 L11.08 10.78 A4.15 4.15 0 0 1 8.86 12.06 L9.28 14.02 A6.15 6.15 0 0 1 6.72 14.02 L7.14 12.06 A4.15 4.15 0 0 1 4.92 10.78 L3.43 12.12 A6.15 6.15 0 0 1 2.15 9.90 L4.05 9.28 A4.15 4.15 0 0 1 4.05 6.72 L2.15 6.10 A6.15 6.15 0 0 1 3.43 3.88 L4.92 5.22 A4.15 4.15 0 0 1 7.14 3.94 Z"/>
              <circle cx="8" cy="8" r="1.9"/>
            </g>
          </svg>
          <span>设置</span>
        </button>
        <div id="daemonStatus">
          <span class="dot" id="daemonDot"></span>
          <span id="daemonText">连接中…</span>
        </div>
      </div>
    </aside>

    <div id="resizer" title="拖动调整宽度"></div>

    <main id="main">
      <header id="topbar" class="drag">
        <div id="sessionTitle">新对话</div>
      </header>

      <div id="stream">
        <div id="emptyState">
          <div id="heroIcon" aria-hidden="true"></div>
          <h1>嗨，我是 Mai</h1>
          <p>选择一个项目文件夹作为工作区，描述你的目标，我会规划步骤、调用工具，并把执行过程实时展示在这里。</p>
          <div class="chips">
            <button class="chip" data-prompt="分析当前项目的目录结构，写一份简短的架构总结">分析项目结构</button>
            <button class="chip" data-prompt="写一个命令行待办清单工具，支持增删和列表">写一个待办清单 CLI 工具</button>
            <button class="chip" data-prompt="检查项目里有没有遗漏的 TODO 和调试代码">检查遗留 TODO</button>
          </div>
        </div>
        <div id="stream-inner"></div>
      </div>

      <footer id="composerWrap">
        <div class="composer-outer">
          <div class="composer no-drag">
            <textarea id="input" rows="1"
              placeholder="描述你的目标，Enter 发送，Shift+Enter 换行"></textarea>
            <button id="sendBtn" title="发送" aria-label="发送">
              <svg viewBox="0 0 16 16" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
            </button>
          </div>
          <div class="composer-meta no-drag">
            <span class="composer-hint">敏感工具操作会先请求审批</span>
            <span class="meta-right">
              <span id="ctxMeter" class="ctx hidden" title="上下文占用">
                <span class="track"><i id="ctxBar"></i></span>
                <span id="ctxPct"></span>
              </span>
              <span class="model-anchor">
                <button id="modelChip" title="切换模型">
                  <svg viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M8 1.2 13.7 4.4v6.4L8 13.8 2.3 10.8V4.4L8 1.2Zm0 1.7L3.9 5.1v5.1L8 12.4l4.1-2.2V5.1L8 2.9ZM8 6a1.9 1.9 0 1 1 0 3.8A1.9 1.9 0 0 1 8 6Z"/></svg>
                  <span id="modelName">—</span>
                  <span class="chev">▾</span>
                </button>
                <div id="modelPopover" class="popover hidden"></div>
              </span>
            </span>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- 设置面板 -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>设置</h2>
        <button id="settingsClose" class="ghost-btn icon-btn" title="关闭">✕</button>
      </div>

      <div class="settings-row">
        <span class="row-icon"><svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M8 1.5a6.5 6.5 0 1 0 0 13A6.5 6.5 0 0 0 8 1.5Zm0 1.6c.4 0 .7.3.7.7v.7a.7.7 0 0 1-1.4 0v-.7c0-.4.3-.7.7-.7ZM4.5 7.3a.7.7 0 0 1 0 1.4h-.7a.7.7 0 0 1 0-1.4h.7Zm7.7 0a.7.7 0 0 1 0 1.4h-.7a.7.7 0 0 1 0-1.4h.7ZM8 5.2A2.8 2.8 0 1 1 8 10.8 2.8 2.8 0 0 1 8 5.2Zm0 1.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Zm0 5.2c.4 0 .7.3.7.7v.3a6.5 6.5 0 0 1-1.4 0v-.3c0-.4.3-.7.7-.7Z"/></svg></span>
        <span class="row-label">外观</span>
        <div class="segmented" id="themeSegment">
          <button data-theme="light">浅色</button>
          <button data-theme="dark" class="active">深色</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="group-title">模型与端点</div>
        <label class="field">
          <span class="row-icon"><svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M6 3.5A2.5 2.5 0 0 1 8.5 6c0 .9-.5 1.7-1.2 2.2l3.5 3.5a.8.8 0 0 1-1.1 1.1L6.2 9.3A2.5 2.5 0 1 1 6 3.5Zm0 1.6a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8Zm5.5-1.8c.2 0 .4.1.6.2l1.4 1.4a.8.8 0 0 1 0 1.2l-2.3 2.3-1.7-1.7 1.4-1.4a.8.8 0 0 1 .6-.2Z"/></svg></span>
          <span class="row-label">Base URL</span>
          <input id="cfgBaseUrl" type="text" placeholder="https://api.deepseek.com/anthropic" spellcheck="false" />
        </label>
        <label class="field">
          <span class="row-icon"><svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M10.5 1.5a4 4 0 0 0-3.9 4.9L1.8 11.2a1 1 0 0 0-.3.7v2.1a.5.5 0 0 0 .5.5h2.6a.5.5 0 0 0 .5-.5v-1h1a.5.5 0 0 0 .5-.5v-1h1c.3 0 .5-.1.7-.3l.4-.4A4 4 0 1 0 10.5 1.5Zm1.5 4a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg></span>
          <span class="row-label">API Key</span>
          <input id="cfgApiKey" type="password" placeholder="已配置则留空保持不变" autocomplete="off" />
        </label>
        <label class="field">
          <span class="row-icon"><svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 1.2 13.7 4.4v6.4L8 13.8 2.3 10.8V4.4L8 1.2Zm0 1.7L3.9 5.1v5.1L8 12.4l4.1-2.2V5.1L8 2.9ZM8 6a1.9 1.9 0 1 1 0 3.8A1.9 1.9 0 0 1 8 6Z"/></svg></span>
          <span class="row-label">默认模型</span>
          <input id="cfgModel" type="text" list="modelOptions" placeholder="deepseek-chat" spellcheck="false" />
          <datalist id="modelOptions"></datalist>
        </label>
        <div class="settings-actions">
          <button id="probeBtn" class="secondary-btn">验证并获取模型</button>
          <button id="saveCfgBtn" class="primary-btn">保存</button>
        </div>
        <div id="cfgHint" class="cfg-hint"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
